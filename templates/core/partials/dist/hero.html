{% load portfolio_extras %}
<header class="hero" id="top">
  <div class="wrap hero-grid">
    <div class="hero-text">
      <div class="eyebrow">
        <span class="dot"></span>
        {{ profile.headline }}
      </div>
      <h1>{{ profile.hero_statement|safe_inline }}</h1>
      {% if profile.intro %}
        <p class="hero-lede">{{ profile.intro|safe_inline }}</p>
      {% endif %}
      <div class="hero-actions">
        <a href="#story" class="btn btn-primary">Read my story →</a>
        <a href="#contact" class="btn btn-ghost">Work with me</a>
      </div>
    </div>
    <div class="hero-portrait">
      <div class="portrait-wrapper">
        <div class="portrait-frame {{ profile.portrait_frame_shape|shape }}">
          {% if profile.portrait %}
            <img src="{{ profile.portrait.url }}" alt="Portrait of {{ profile.full_name }}">
          {% else %}
            <div class="portrait-placeholder">
              <svg fill="none" stroke="currentColor" stroke-width="1.4" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
              </svg>
              <span>Portrait</span>
            </div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</header>
